<!doctype html>
<!--
  "No events" empty state, recreated (Kyle had no screen grab of it). Modeled on the product's
  "No integrations connected" screen from the same era: same shell, same layout, an events illustration,
  "No events created", and "+ Add Event". Mock content only.
  Render to public/assets/hunch/no-events.png with: sh scripts/empty-states/render.sh
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=block">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1512px; height: 982px; overflow: hidden; font-family: Roboto, sans-serif; color: #1e2125; background: #fff; }
  .app { display: flex; height: 982px; }

  /* sidebar */
  .side { width: 240px; flex: none; background: #1f2d3d; color: #fff; padding: 20px 12px; }
  .logo { display: block; height: 28px; width: auto; margin: 2px 0 22px 10px; }
  .ws { border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 10px 14px; display: flex; align-items: center; margin-bottom: 18px; }
  .ws span { flex: 1; display: flex; flex-direction: column; }
  .ws small { font-size: 13px; color: rgba(255,255,255,0.6); line-height: 18px; }
  .ws b { font-size: 16px; font-weight: 600; line-height: 22px; }
  .row { height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 14px; font-weight: 500; }
  .row svg { width: 20px; height: 20px; flex: none; }
  .row .label { flex: 1; }
  .caret { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid #fff; }
  .caret.up { border-top: 0; border-bottom: 5px solid #fff; }
  .caret.right { border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 5px solid #fff; border-right: 0; }
  .group { background: rgba(255,255,255,0.05); border-radius: 6px; padding-bottom: 4px; }
  .sub { height: 44px; display: flex; align-items: center; padding-left: 40px; font-size: 14px; font-weight: 500; margin-left: 0; }
  .sub.on { background: rgba(255,255,255,0.12); border-radius: 6px 0 0 6px; margin-left: 28px; padding-left: 12px; }

  /* main */
  .main { flex: 1; display: flex; flex-direction: column; }
  .top { height: 56px; flex: none; border-bottom: 1px solid #dde0e4; display: flex; align-items: center; padding: 0 32px; }
  .crumb { flex: 1; font-size: 12px; font-weight: 700; line-height: 24px; }
  .tools { display: flex; align-items: center; gap: 4px; }
  .tool { width: 48px; height: 48px; display: grid; place-items: center; position: relative; }
  .tool img { width: 24px; height: 24px; }
  .badge { position: absolute; right: 7px; top: 7px; background: #3f51b5; color: #fff; border: 1px solid #fff; border-radius: 99px; font-size: 10px; font-weight: 500; line-height: 12px; padding: 2px 5px; }
  .avatar { width: 36px; height: 36px; border-radius: 99px; background: #6473c9; color: #fff; display: grid; place-items: center; font-size: 14px; }

  .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding-bottom: 80px; }
  .art { position: relative; width: 136px; height: 136px; }
  .card { position: absolute; background: #f4f6f8; border-radius: 6.6px; box-shadow: 0 0.8px 1.6px rgba(0,0,0,0.2); display: grid; place-items: center; }
  .card.a { width: 72px; height: 72px; left: 4px; top: 54px; transform: rotate(-20deg); }
  .card.b { width: 84px; height: 84px; left: 44px; top: 10px; transform: rotate(15deg); }
  .text { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  h1 { font-size: 32px; font-weight: 600; line-height: 40px; }
  p { font-size: 16px; line-height: 24px; }
  .btn { margin-top: 8px; display: inline-flex; align-items: center; gap: 8px; background: #3f51b5; color: #fff; border-radius: 4px; padding: 12px 24px 12px 16px; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
  .btn svg { width: 24px; height: 24px; }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <img class="logo" src="logo.svg" alt="Freshpaint">
    <div class="ws"><span><small>Main</small><b>Production</b></span><i class="caret right"></i></div>

    <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h16M7 5v0M7 19v0"/><rect x="3" y="3" width="18" height="18" rx="3" opacity="0"/></svg><span class="label">SDK Setup</span><i class="caret"></i></div>
    <div class="group">
      <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V14M9 20V10M14 20v-6M19 20V8M3 9l5-4 5 4 7-5"/></svg><span class="label">Marketing</span><i class="caret up"></i></div>
      <div class="sub">Ad Performance</div>
      <div class="sub">Audiences</div>
      <div class="sub on">Attribution</div>
    </div>
    <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/><rect x="15" y="9" width="6" height="6" rx="1"/><path d="M9 6h3v12H9M12 12h3"/></svg><span class="label">Integrations</span><i class="caret"></i></div>
    <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 6h7a3 3 0 010 6H10a3 3 0 000 6h7"/></svg><span class="label">Events</span><i class="caret"></i></div>
    <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h1M11 8h5M8 12h1M11 12h5M8 16h1M11 16h5"/></svg><span class="label">Forms</span></div>
    <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg><span class="label">Video</span></div>
    <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12.22 2h-.44a2 2 0 00-2 2v.18a2 2 0 01-1 1.73l-.43.25a2 2 0 01-2 0l-.15-.08a2 2 0 00-2.73.73l-.22.38a2 2 0 00.73 2.73l.15.1a2 2 0 011 1.72v.51a2 2 0 01-1 1.74l-.15.09a2 2 0 00-.73 2.73l.22.38a2 2 0 002.73.73l.15-.08a2 2 0 012 0l.43.25a2 2 0 011 1.73V20a2 2 0 002 2h.44a2 2 0 002-2v-.18a2 2 0 011-1.73l.43-.25a2 2 0 012 0l.15.08a2 2 0 002.73-.73l.22-.39a2 2 0 00-.73-2.73l-.15-.08a2 2 0 01-1-1.74v-.5a2 2 0 011-1.74l.15-.09a2 2 0 00.73-2.73l-.22-.38a2 2 0 00-2.73-.73l-.15.08a2 2 0 01-2 0l-.43-.25a2 2 0 01-1-1.73V4a2 2 0 00-2-2z"/></svg><span class="label">Settings</span><i class="caret"></i></div>
  </aside>

  <main class="main">
    <div class="top">
      <span class="crumb">Attribution</span>
      <span class="tools">
        <span class="tool"><img src="bell.svg" alt=""><span class="badge">1</span></span>
        <span class="tool"><img src="help.svg" alt=""></span>
        <span class="tool"><span class="avatar">AN</span></span>
      </span>
    </div>

    <div class="empty">
      <!-- the events illustration: two tilted tiles, as on "No integrations connected", with event glyphs -->
      <div class="art">
        <div class="card a">
          <!-- a click -->
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#6473c9" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9l11 4-5 2-2 5z"/><path d="M5 5l2 2M9 3v2.5M3 9h2.5"/></svg>
        </div>
        <div class="card b">
          <!-- a tracked conversion -->
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#3f51b5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.8" fill="#3f51b5"/></svg>
        </div>
      </div>
      <div class="text">
        <h1>No events created</h1>
        <p>Create an event to start tracking conversions in Attribution.</p>
      </div>
      <span class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add Event</span>
    </div>
  </main>
</div>
</body>
</html>
